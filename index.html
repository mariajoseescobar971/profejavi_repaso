<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Repaso · 3.º DS «B» (v0.4)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070a15;
      --panel: #0f1630;
      --panel2: #0b1124;
      --line: #222c55;
      --line2: #33407a;
      --tx: #e8edfb;
      --mut: #9ba7ce;
      --cy: #22d3ee;
      --mg: #f046d2;
      --am: #ffb224;
      --gr: #34f5a0;
      --fd: 'Orbitron', system-ui, sans-serif;
      --fb: 'Exo 2', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--fb);
      background: var(--bg);
      color: var(--tx);
      line-height: 1.6;
      padding: 20px;
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      font-family: var(--fd);
      font-size: clamp(24px, 4vw, 36px);
      color: var(--cy);
      margin-bottom: 8px;
    }

    p.sub { color: var(--mut); }

    /* Grilla de Tarjetas de Módulos */
    .modulos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .card-mod {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--cy);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card-mod.arcides {
      border-top-color: var(--mg);
    }

    .card-mod:hover {
      transform: translateY(-4px);
      border-color: var(--cy);
    }
    .card-mod.arcides:hover {
      border-color: var(--mg);
    }

    .card-mod h3 {
      font-family: var(--fd);
      font-size: 16px;
      color: var(--tx);
      margin-bottom: 6px;
    }

    .card-mod .docente {
      font-size: 13px;
      color: var(--mg);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .card-mod.javier .docente {
      color: var(--cy);
    }

    .card-mod p {
      font-size: 14px;
      color: var(--mut);
      margin-bottom: 16px;
    }

    .btn-ficha {
      background: linear-gradient(135deg, #0891b2, var(--cy));
      color: #04121a;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-family: var(--fb);
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .card-mod.arcides .btn-ficha {
      background: linear-gradient(135deg, #a21caf, var(--mg));
      color: #fff;
    }

    .btn-ficha:hover { filter: brightness(1.1); }

    /* Modal dialog */
    dialog {
      margin: auto;
      background: var(--panel);
      color: var(--tx);
      border: 1px solid var(--line2);
      border-radius: 16px;
      max-width: 650px;
      width: 90%;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    dialog::backdrop {
      background: rgba(7, 10, 21, 0.85);
      backdrop-filter: blur(4px);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-family: var(--fd);
      font-size: 18px;
      color: var(--cy);
    }

    .btn-close {
      background: transparent;
      border: 1px solid var(--line2);
      color: var(--mut);
      font-size: 18px;
      border-radius: 6px;
      width: 30px;
      height: 30px;
      cursor: pointer;
    }

    .btn-close:hover { color: var(--mg); border-color: var(--mg); }

    .sec-ficha { margin-bottom: 14px; }
    .sec-ficha h4 { font-size: 13px; color: var(--am); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sec-ficha ul { padding-left: 20px; font-size: 14px; color: var(--mut); }
    .sec-ficha a { color: var(--cy); text-decoration: none; }
    .sec-ficha a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="wrap">
    <header>
      <h1>HUB de Repaso · Día 2 (v0.4)</h1>
      <p class="sub">3.º Bachillerato Técnico Vocacional en Desarrollo de Software «B»</p>
    </header>

    <!-- Contenedor donde JS insertará los módulos dinámicamente -->
    <main class="modulos-grid" id="modulosGrid"></main>
  </div>

  <!-- Modal/Ficha del Módulo -->
  <dialog id="modalFicha">
    <div class="modal-header">
      <h2 id="modalTitulo">Título Módulo</h2>
      <button class="btn-close" id="btnCerrarModal">✕</button>
    </div>
    <div id="modalCuerpo"></div>
  </dialog>

  <script>
    // Estructura de Datos con los Módulos del Prof. Javier Mineros y Prof. Arcides Canales
    const modulos = [
      // --- MÓDULOS DEL PROF. JAVIER MINEROS ---
      {
        id: "m30",
        nombre: "Módulo 3.0: Orientación al Proceso Educativo del Tercer Año",
        docente: "Prof. Javier Mineros",
        tipo: "javier",
        resumen: "Organización de equipos de trabajo, creación de portafolios y orientación general para el tercer año.",
        instrumentos: ["Portafolio del módulo 3.0", "Espacio para compartir QRs", "Generalidades del módulo"],
        programas: ["Google Classroom", "Google Drive"],
        herramientas: ["Portafolio Digital", "QR Generators"],
        recursos: [
          { nombre: "Generalidades del Módulo 3.0", url: "https://classroom.google.com" }
        ],
        evidencias: [
          { nombre: "Entrega de Portafolio e Integración de Equipos", url: "https://github.com" }
        ]
      },
      {
        id: "m32",
        nombre: "Módulo 3.2: Mantenimiento y Aseguramiento de Sistemas Informáticos",
        docente: "Prof. Javier Mineros",
        tipo: "javier",
        resumen: "Monitoreo, registro de mantenimiento, creación de tiquetes, plantillas SLA, modelado UML y planes de contingencia.",
        instrumentos: ["Plantilla SLA", "Registro de tiquetes y monitoreo", "Planes de contingencia y testeo"],
        programas: ["Visual Studio Code", "StarUML / Draw.io", "Power BI"],
        herramientas: ["UML", "Dashboards de Monitoreo", "Testing de Software"],
        recursos: [
          { nombre: "Modelado de Software UML", url: "https://developer.mozilla.org/es/" },
          { nombre: "Plantilla de Acuerdos SLA", url: "https://docs.github.com" }
        ],
        evidencias: [
          { nombre: "Proyecto Final de Mantenimiento y Dashboard", url: "https://github.com" }
        ]
      },
      {
        id: "m33",
        nombre: "Módulo 3.3: Administración de Bases de Datos",
        docente: "Prof. Javier Mineros",
        tipo: "javier",
        resumen: "Administración de BD, ejecución de scripts, actividades remediales, analítica y reportes con Power BI.",
        instrumentos: ["Guías de ejecución (Semanas 9 a 11)", "Actividades remediales", "Rúbrica de Power BI"],
        programas: ["Power BI Desktop", "MySQL Workbench", "SQL Server"],
        herramientas: ["SQL / DML / DDL", "DAX", "Power BI Dashboards"],
        recursos: [
          { nombre: "Guía de Instalación de Power BI", url: "https://powerbi.microsoft.com/" },
          { nombre: "Documentación de MySQL", url: "https://dev.mysql.com/doc/" }
        ],
        evidencias: [
          { nombre: "Dashboard Final y Documentación", url: "https://github.com" }
        ]
      },
      {
        id: "m34",
        nombre: "Módulo 3.4: Elaboración de Documentación de Sistemas Informáticos",
        docente: "Prof. Javier Mineros",
        tipo: "javier",
        resumen: "Documentación técnica por fases del ciclo de vida del software, arquitectura del sistema y desarrollo con Python.",
        instrumentos: ["Fases de documentación (Fase 1 a 7)", "Guía individual de Python"],
        programas: ["Python 3", "VS Code", "PyCharm"],
        herramientas: ["Python", "Arquitectura de Software", "UML"],
        recursos: [
          { nombre: "Documentación Oficial de Python", url: "https://docs.python.org/es/3/" }
        ],
        evidencias: [
          { nombre: "Aplicaciones con Python y Documentación Final", url: "https://github.com" }
        ]
      },
      {
        id: "m38",
        nombre: "Módulo 3.8: Proyecto Innovador de Desarrollo de Software",
        docente: "Prof. Javier Mineros",
        tipo: "javier",
        resumen: "Desarrollo integral de un proyecto informático innovador, elaboración del manual de sistema y exposiciones finales.",
        instrumentos: ["Avances de proyecto (10% y 15%)", "Manual de sistema", "Rúbrica de exposiciones"],
        programas: ["Visual Studio Code", "Git / GitHub"],
        herramientas: ["HTML/CSS/JS", "Python / C#", "GitHub Pages"],
        recursos: [
          { nombre: "Documentación de GitHub Issues", url: "https://docs.github.com/es" }
        ],
        evidencias: [
          { nombre: "Entrega Final y Exposición del Proyecto", url: "https://github.com" }
        ]
      },

      // --- MÓDULOS DEL PROF. ARCIDES CANALES ---
      {
        id: "m40",
        nombre: "Módulo 4: Puesta en Marcha de la Empresa en Asociatividad Cooperativa",
        docente: "Prof. Arcides Canales",
        tipo: "arcides",
        resumen: "Proyectos integradores de tecnología aplicada a empresas cooperativas con Arduino, ASPX, WinForms, .NET MAUI y PrestaShop.",
        instrumentos: ["Proyecto Agustine-Arduino (25%)", "Proyecto Winform y ASPX (25%)", "Proyecto Final .NET MAUI (25%)", "PrestaShop Individual (25%)"],
        programas: ["Visual Studio", "Arduino IDE", "PrestaShop"],
        herramientas: ["C#", ".NET MAUI", "ASP.NET / WinForms", "Arduino C++"],
        recursos: [
          { nombre: "Microsoft Learn (.NET MAUI)", url: "https://learn.microsoft.com/es-es/dotnet/maui/" },
          { nombre: "Documentación de Arduino", url: "https://www.arduino.cc/" }
        ],
        evidencias: [
          { nombre: "Tienda PrestaShop & App Móvil .NET MAUI", url: "https://github.com" }
        ]
      },
      {
        id: "m3eng",
        nombre: "Módulo 3: Conversación de Inglés sobre Mantenimiento de Sistemas",
        docente: "Prof. Arcides Canales",
        tipo: "arcides",
        resumen: "Comunicación técnica en inglés para soporte de sistemas, metodología agil SCRUM y operaciones CRUD asistidas por IA.",
        instrumentos: ["Práctica 10: SCRUM", "Práctica 11: Base de datos CRUD-IA"],
        programas: ["VS Code", "Herramientas de IA Generativa"],
        herramientas: ["SCRUM", "CRUD Operations", "Technical English"],
        recursos: [
          { nombre: "Guía de Metodología SCRUM", url: "https://www.scrum.org/" }
        ],
        evidencias: [
          { nombre: "Práctica CRUD asistida por IA", url: "https://github.com" }
        ]
      },
      {
        id: "m2mov",
        nombre: "Módulo 2: Desarrollo de Componentes para Dispositivos Móviles",
        docente: "Prof. Arcides Canales",
        tipo: "arcides",
        resumen: "Diseño y construcción de aplicaciones móviles multiplataforma mediante el framework .NET MAUI.",
        instrumentos: ["Prácticas 06 a 09 (.NET MAUI)", "Autoevaluación Práctica 9", "Guía de Nivelación/Recuperación"],
        programas: ["Visual Studio 2022", "Emuladores Android / iOS"],
        herramientas: [".NET MAUI", "XAML", "C# Mobile"],
        recursos: [
          { nombre: "Diseño UI en .NET MAUI", url: "https://learn.microsoft.com/es-es/dotnet/maui/user-interface/" }
        ],
        evidencias: [
          { nombre: "App Móvil Multiplataforma", url: "https://github.com" }
        ]
      },
      {
        id: "m31",
        nombre: "BTVDS 3.1: Desarrollo de Aplicaciones de Software para Solución de Problemas",
        docente: "Prof. Arcides Canales",
        tipo: "arcides",
        resumen: "Fundamentos de Programación Orientada a Objetos (POO), herencia, polimorfismo, acceso a datos y Razor Pages con Code First.",
        instrumentos: ["Prácticas 1 y 2 (POO Herencia/Polimorfismo)", "Práctica 3 (Acceso a Datos)", "Prácticas 4 y 5 (Code First - ASP Razor)"],
        programas: ["Visual Studio", "SQL Server Management Studio"],
        herramientas: ["POO (C#)", "Entity Framework Code First", "ASP.NET Razor Pages"],
        recursos: [
          { nombre: "Aprende C# y POO en Microsoft Learn", url: "https://learn.microsoft.com/es-es/dotnet/csharp/" }
        ],
        evidencias: [
          { nombre: "Sistema Web con ASP.NET Razor y Code First", url: "https://github.com" }
        ]
      }
    ];

    const grid = document.getElementById('modulosGrid');
    const modal = document.getElementById('modalFicha');
    const modalTitulo = document.getElementById('modalTitulo');
    const modalCuerpo = document.getElementById('modalCuerpo');
    const btnCerrar = document.getElementById('btnCerrarModal');

    function renderizarModulos() {
      grid.innerHTML = '';
      modulos.forEach(mod => {
        const card = document.createElement('article');
        card.className = `card-mod ${mod.tipo}`;
        card.innerHTML = `
          <div>
            <h3>${mod.nombre}</h3>
            <div class="docente">${mod.docente}</div>
            <p>${mod.resumen}</p>
          </div>
          <button class="btn-ficha" onclick="abrirFicha('${mod.id}')">Ver Ficha Completa</button>
        `;
        grid.appendChild(card);
      });
    }

    function abrirFicha(id) {
      const mod = modulos.find(item => item.id === id);
      if (!mod) return;

      modalTitulo.textContent = mod.nombre;
      modalCuerpo.innerHTML = `
        <p style="color:var(--mut); margin-bottom:16px;"><strong>Docente:</strong> ${mod.docente}</p>
        
        <div class="sec-ficha">
          <h4>Instrumentos</h4>
          <ul>${mod.instrumentos.map(i => `<li>${i}</li>`).join('')}</ul>
        </div>
        
        <div class="sec-ficha">
          <h4>Programas</h4>
          <ul>${mod.programas.map(p => `<li>${p}</li>`).join('')}</ul>
        </div>
        
        <div class="sec-ficha">
          <h4>Herramientas</h4>
          <ul>${mod.herramientas.map(h => `<li>${h}</li>`).join('')}</ul>
        </div>
        
        <div class="sec-ficha">
          <h4>Recursos</h4>
          <ul>${mod.recursos.map(r => `<li><a href="${r.url}" target="_blank" rel="noopener">${r.nombre}</a></li>`).join('')}</ul>
        </div>

        <div class="sec-ficha">
          <h4>Evidencias</h4>
          <ul>${mod.evidencias.map(e => `<li><a href="${e.url}" target="_blank" rel="noopener">${e.nombre}</a></li>`).join('')}</ul>
        </div>
      `;

      modal.showModal();
    }

    btnCerrar.addEventListener('click', () => modal.close());

    modal.addEventListener('click', (e) => {
      const rect = modal.getBoundingClientRect();
      if (
        e.clientX < rect.left || e.clientX > rect.right ||
        e.clientY < rect.top || e.clientY > rect.bottom
      ) {
        modal.close();
      }
    });

    document.addEventListener('DOMContentLoaded', renderizarModulos);
  </script>
</body>
</html>
